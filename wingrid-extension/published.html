<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WinGrid - Published Layout</title>
    <link rel="stylesheet" href="published.css" />
  </head>
  <body>
    <!-- Close button -->
    <button id="closeBtn" class="close-btn">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>

    <!-- Composite Canvas -->
    <canvas id="publishedCanvas"></canvas>

    <script src="published.js"></script>
  </body>
</html>
