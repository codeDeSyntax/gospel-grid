<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WinGrid</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <div class="header">
        <h1>WinGrid</h1>
        <p class="subtitle">Multi-Window Compositor</p>
      </div>

      <div class="actions">
        <button id="openCompositor" class="primary-btn">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
          <span>Open Compositor</span>
        </button>

        <button id="openSettings" class="secondary-btn">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 1v6m0 6v6m-5.2-5.2l4.2-4.2m0 8.4l4.2 4.2M1 12h6m6 0h6m-5.2 5.2l-4.2-4.2m0-8.4l-4.2-4.2"
            />
          </svg>
          <span>Settings</span>
        </button>
      </div>

      <div class="info">
        <div class="info-item">
          <span class="label">Status:</span>
          <span class="value" id="status">Ready</span>
        </div>
        <div class="info-item">
          <span class="label">Windows:</span>
          <span class="value" id="windowCount">0</span>
        </div>
      </div>

      <div class="footer">
        <a href="https://github.com/yourusername/wingrid" target="_blank"
          >About</a
        >
        <span>•</span>
        <a href="#" id="help">Help</a>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
