name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer and Electron bundles
        run: pnpm run build

      - name: Package Windows app
        run: pnpm exec electron-builder --win --publish=never

      - name: Verify packaged updater dependencies
        run: pnpm run verify:package

      - name: Publish verified release files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*/Wingrid_*.exe
            release/*/Wingrid_*.exe.blockmap
            release/*/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
