<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Wingrid</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* ── Clean Minimal Obsidian Card (420×270) ── */
    .card {
      position: relative;
      width: 420px;
      height: 270px;
      background: linear-gradient(145deg, #181d16 0%, #0e120c 60%, #070906 100%);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(133, 202, 62, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.95);
      animation: cardEnter 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEnter {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ── Subtle Ambient Glow Behind Icon ── */
    .ambient-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(133, 202, 62, 0.22) 0%, rgba(94, 172, 36, 0.06) 50%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* ── Center Content ── */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .icon-wrap {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 3s ease-in-out infinite alternate;
    }

    @keyframes float {
      0% { transform: translateY(0); filter: drop-shadow(0 8px 24px rgba(133, 202, 62, 0.3)); }
      100% { transform: translateY(-4px); filter: drop-shadow(0 14px 32px rgba(133, 202, 62, 0.45)); }
    }

    .app-icon {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .version-text {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.55);
      background: rgba(255, 255, 255, 0.05);
      padding: 3px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="ambient-glow"></div>
    <div class="content">
      <div class="icon-wrap">
        <img class="app-icon" src="wingrid.png" alt="Wingrid"/>
      </div>
      <span class="version-text">v2.2.42</span>
    </div>
  </div>

</body>
</html>
