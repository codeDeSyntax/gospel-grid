<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Wingrid</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: #060a0e url('splash-bg.jpg') no-repeat center center / cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* Ambient dark vignette */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 15, 25, 0.2) 0%, rgba(0, 10, 18, 0.65) 100%);
      pointer-events: none;
    }

    /* ── Crisp Long White Splash Bar (700px × 88px) ── */
    .word-card {
      position: relative;
      z-index: 10;
      width: 700px;
      height: 88px;
      background: #ffffff;
      border-radius: 0px;
      border: none;
      box-shadow: 
        0 24px 70px rgba(0, 0, 0, 0.65),
        0 6px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 36px;
      color: #111827;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.97);
      animation: wordCardEnter 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes wordCardEnter {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Centered Brand Items: Logo + Title */
    .brand-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo-box {
      width: 44px;
      height: 44px;
      border-radius: 0px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.15));
    }

    .title-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .top-tag {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .main-title {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.4px;
      color: #111827;
      line-height: 1;
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .main-title span {
      color: #006089;
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>

  <!-- Crisp Long White Splash Bar -->
  <div class="word-card">
    <!-- Centered: Logo + App Name -->
    <div class="brand-content">
      <div class="logo-box">
        <img src="wingrid.png" alt="Wingrid" class="logo-img"/>
      </div>
      <div class="title-col">
        <span class="top-tag">Office</span>
        <h1 class="main-title">Win<span>grid</span></h1>
      </div>
    </div>
  </div>

</body>
</html>
